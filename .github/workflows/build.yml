name: Build et publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger Tweego
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo tmedwards/tweego --pattern '*linux-x64*.zip' --output tweego.zip
          unzip -q tweego.zip -d tweego-bin
          chmod +x tweego-bin/tweego

      - name: Compiler le jeu
        env:
          TWEEGO_PATH: ${{ github.workspace }}/storyformats
        run: |
          mkdir -p dist
          ./tweego-bin/tweego -o dist/index.html src

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4